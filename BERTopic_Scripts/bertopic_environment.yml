name: bertopic_env
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core data science packages
  - numpy=1.24.3
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - scipy=1.11.1

  # NLP and text processing
  - nltk=3.8.1

  # Topic modeling and embeddings
  - sentence-transformers=2.2.2
  - umap-learn=0.5.3
  - hdbscan=0.8.33

  # Deep learning and GPU support
  - pytorch=2.0.1
  - pytorch-cuda=11.8
  - cudatoolkit=11.8

  # Visualization
  - matplotlib=3.7.2
  - plotly=5.15.0

  # Utilities
  - tqdm=4.65.0

  # pip packages (not available via conda or better via pip)
  - pip=23.2.1
  - pip:
    - bertopic==0.15.0
    - transformers==4.31.0
    - tokenizers==0.13.3
    - datasets==2.14.4
    - huggingface-hub==0.16.4
    - psutil
    # Optional: GPU-accelerated UMAP (requires CUDA 11.x)
    # Uncomment if you have compatible NVIDIA GPU
    # - cuml-cu11==23.08.00
    # - cupy-cuda11x==12.2.0